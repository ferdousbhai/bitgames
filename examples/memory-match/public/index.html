<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Memory Match</title>
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
</head>
<body>
<canvas id="view"></canvas>
<div class="vignette"></div>

<div id="loading" class="screen">
  <div class="paws">🐾</div>
  <div class="bar"><i id="loading-bar"></i></div>
  <button id="reload" class="big-go oops" aria-label="Try again">🔁</button>
</div>

<div id="menu" class="overlay hidden">
  <button id="menu-mute" class="round corner" aria-label="Sound">🔊</button>
  <div class="menu-bottom">
    <button id="play" class="play" aria-label="Play">▶</button>
    <div id="levels" class="levels" role="group" aria-label="Board size"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-left">
    <button id="home" class="round" aria-label="Home">🏠</button>
    <button id="mute" class="round" aria-label="Sound">🔊</button>
  </div>
  <div class="hud-center">
    <div id="pairs" class="pairs"></div>
  </div>
</div>

<div id="hand" class="hand hidden" aria-hidden="true"><svg viewBox="-6 -6 92 108" width="1em" height="1.17em"><g fill="#5a3d7a" stroke="#5a3d7a" stroke-width="10" stroke-linejoin="round"><rect x="30" y="4" width="20" height="54" rx="10"/><rect x="47" y="30" width="17" height="30" rx="8.5"/><rect x="61" y="37" width="14" height="26" rx="7"/><rect x="20" y="42" width="55" height="50" rx="20"/><rect x="6" y="52" width="18" height="34" rx="9" transform="rotate(-28 15 69)"/></g><g fill="#fff"><rect x="30" y="4" width="20" height="54" rx="10"/><rect x="47" y="30" width="17" height="30" rx="8.5"/><rect x="61" y="37" width="14" height="26" rx="7"/><rect x="20" y="42" width="55" height="50" rx="20"/><rect x="6" y="52" width="18" height="34" rx="9" transform="rotate(-28 15 69)"/></g><path d="M36 14 v18" stroke="#ffd6e4" stroke-width="5" stroke-linecap="round"/></svg></div>

<div id="win" class="overlay win hidden">
  <div class="win-card">
    <div id="win-stars" class="stars"></div>
    <div class="row">
      <button id="next" class="big-go" aria-label="Next">▶</button>
      <button id="again" class="big-go alt" aria-label="Again">🔁</button>
      <button id="win-home" class="big-go alt" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
