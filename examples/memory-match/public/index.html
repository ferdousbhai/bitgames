<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Memory Match</title>
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
</head>
<body>
<canvas id="view"></canvas>
<div class="vignette"></div>

<div id="loading" class="screen">
  <div class="logo"><span>M</span><span>e</span><span>m</span><span>o</span><span>r</span><span>y</span> <span>M</span><span>a</span><span>t</span><span>c</span><span>h</span></div>
  <div class="paws">🐾</div>
  <div id="loading-text">Waking up the animals…</div>
</div>

<div id="menu" class="overlay hidden">
  <div class="menu-top">
    <div class="logo"><span>M</span><span>e</span><span>m</span><span>o</span><span>r</span><span>y</span> <span>M</span><span>a</span><span>t</span><span>c</span><span>h</span></div>
    <p class="hint">Find the animal twins! Tap an animal to say hello.</p>
  </div>
  <div class="menu-bottom">
    <button id="play" class="big-go">▶ Play</button>
    <div id="levels" class="levels"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-left">
    <button id="home" class="round" title="Home">🏠</button>
    <button id="mute" class="round" title="Sound">🔊</button>
    <button id="peek" class="round" title="Peek at one pair" aria-label="Peek at one matching pair">👀</button>
  </div>
  <div class="hud-center">
    <div id="level-pill" class="pill">Level 1</div>
    <div id="pairs" class="pairs"></div>
  </div>
</div>

<div id="banner" class="banner"></div>

<div id="win" class="overlay win hidden">
  <div class="win-card">
    <h1 id="win-title">Hooray!</h1>
    <div id="win-stars" class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <p id="win-text" class="hint"></p>
    <div class="row">
      <button id="next" class="big-go">Next ▶</button>
      <button id="again" class="big-go alt">🔁</button>
      <button id="win-home" class="big-go alt">🏠</button>
    </div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
