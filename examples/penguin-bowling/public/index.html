<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Penguin Bowling</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/",
  "cannon": "./lib/cannon-es.js"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
</head>
<body>
<canvas id="view"></canvas>

<div id="loading" class="screen" aria-label="Loading">
  <div class="spinner">🐧</div>
</div>

<div id="title" class="screen card-screen hidden">
  <div class="card">
    <div class="logo" aria-label="Penguin Bowling"><span>P</span><span>E</span><span>N</span><span>G</span><span>U</span><span>I</span><span>N</span><br /><span>B</span><span>O</span><span>W</span><span>L</span><span>I</span><span>N</span><span>G</span></div>
    <div id="lanes" class="lanes">
      <button data-theme="village" class="lane-btn" aria-label="Igloo lane">🏠</button>
      <button data-theme="aurora" class="lane-btn" aria-label="Night lane">🌌</button>
      <button data-theme="bay" class="lane-btn" aria-label="Fishy lane">🐟</button>
    </div>
    <div id="wardrobe" class="wardrobe" aria-label="Hats">
      <button data-hat="crown" aria-label="Crown">👑</button>
      <button data-hat="party" aria-label="Party hat">🎉</button>
      <button data-hat="tophat" aria-label="Top hat">🎩</button>
      <button data-hat="fish" aria-label="Fish hat">🐟</button>
    </div>
    <div class="title-row">
      <button id="bumpers" class="toggle on" aria-label="Bumpers" aria-pressed="true">🛟</button>
      <button id="play" class="big-go" aria-label="Play">▶</button>
    </div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-left">
      <button id="home" class="round-btn hold-btn" aria-label="Home (hold)">🏠</button>
    </div>
    <div id="card" class="pips" aria-label="Frames"></div>
    <div class="hud-right">
      <button id="music" class="round-btn hold-btn" aria-label="Music (hold)">🎵</button>
      <button id="sound" class="round-btn hold-btn" aria-label="Sound (hold)">🔊</button>
    </div>
  </div>
  <div id="rack" class="rack" aria-hidden="true"></div>
  <div id="controls" class="controls">
    <div class="ctl-group">
      <button id="left" class="ctl" aria-label="Move left">◀</button>
      <button id="right" class="ctl" aria-label="Move right">▶</button>
    </div>
    <button id="go" class="go" aria-label="Slide">🐧💨</button>
  </div>
  <div id="hint" class="hint-swipe hidden" aria-hidden="true"><i class="trail"></i><span class="hand">👆</span></div>
</div>

<div id="results" class="screen card-screen hidden">
  <div class="card">
    <div class="trophy">🏆</div>
    <div id="medals" class="medals" aria-hidden="true"></div>
    <div class="row">
      <button id="again" class="big-go" aria-label="Play again">🔁</button>
      <button id="to-home" class="big-go alt hold-btn" aria-label="Home (hold)">🏠</button>
    </div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
