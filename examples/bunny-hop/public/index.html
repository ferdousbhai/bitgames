<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bunny Hop</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #aee2ff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; }
  #hud { position: fixed; top: 16px; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 800; color: #fff; text-shadow: 0 3px 0 #ff9f1c, 0 6px 12px rgba(0,0,0,.2); pointer-events: none; }
  #oops { position: fixed; top: 40%; left: 0; right: 0; text-align: center; font-size: 56px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #ff595e; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #hint { position: fixed; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 700; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.3); pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://bitgames-store.ferdousbd.workers.dev/vendor/three/build/three.module.js" } }</script>
</head>
<body>
<div id="hud">🥕 0</div>
<div id="oops">Oops! 🙈</div>
<div id="hint">Tap to jump!</div>
<script type="module">
import * as THREE from 'three'

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.shadowMap.enabled = true
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color('#aee2ff')
scene.fog = new THREE.Fog('#aee2ff', 25, 60)
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100)
camera.position.set(-4, 4, 10)
camera.lookAt(3, 1.5, 0)
scene.add(new THREE.HemisphereLight('#ffffff', '#8ac926', 1.8))
const sun = new THREE.DirectionalLight('#ffffff', 2)
sun.position.set(5, 10, 6)
sun.castShadow = true
sun.shadow.camera.left = -15; sun.shadow.camera.right = 25; sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10
scene.add(sun)

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 30), new THREE.MeshLambertMaterial({ color: '#8ac926' }))
ground.rotation.x = -Math.PI / 2
ground.receiveShadow = true
scene.add(ground)
const path = new THREE.Mesh(new THREE.PlaneGeometry(200, 2.4), new THREE.MeshLambertMaterial({ color: '#e9c46a' }))
path.rotation.x = -Math.PI / 2
path.position.y = 0.01
path.receiveShadow = true
scene.add(path)

// Flowers and bushes scroll past for a feeling of speed
const scenery = []
const flowerColors = ['#ff6b9d', '#ffbe0b', '#ffffff', '#6c63ff']
for (let i = 0; i < 40; i++) {
  const bush = Math.random() < 0.3
  const m = bush
    ? new THREE.Mesh(new THREE.SphereGeometry(0.8, 12, 10), new THREE.MeshLambertMaterial({ color: '#5a9e1a' }))
    : new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 6), new THREE.MeshLambertMaterial({ color: flowerColors[i % 4] }))
  m.position.set(-10 + Math.random() * 50, bush ? 0.4 : 0.15, (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 8))
  m.castShadow = bush
  scene.add(m)
  scenery.push(m)
}

// Bunny built from spheres
const bunny = new THREE.Group()
const fur = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.9 })
const pink = new THREE.MeshStandardMaterial({ color: '#ffb3c6' })
const black = new THREE.MeshBasicMaterial({ color: '#222' })
const body = new THREE.Mesh(new THREE.SphereGeometry(0.7, 20, 16), fur)
body.scale.set(1.1, 0.9, 0.9)
body.position.y = 0.7
const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 16), fur)
head.position.set(0.6, 1.3, 0)
const tail = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 10), fur)
tail.position.set(-0.75, 0.8, 0)
bunny.add(body, head, tail)
for (const z of [-0.2, 0.2]) {
  const ear = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.6, 4, 8), fur)
  ear.position.set(0.5, 1.95, z)
  ear.rotation.z = 0.3
  const inner = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.45, 4, 8), pink)
  inner.position.x = 0.06
  ear.add(inner)
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), black)
  eye.position.set(1.0, 1.4, z * 0.9)
  bunny.add(ear, eye)
}
const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), pink)
nose.position.set(1.08, 1.25, 0)
bunny.add(nose)
bunny.traverse((o) => { o.castShadow = true })
scene.add(bunny)

const things = []
const logMat = new THREE.MeshStandardMaterial({ color: '#8d5524', roughness: 1 })
const carrotMat = new THREE.MeshStandardMaterial({ color: '#ff8c1a' })
const leafMat = new THREE.MeshStandardMaterial({ color: '#3a7d0a' })

function spawnLog(x) {
  const log = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2.2, 16), logMat)
  log.rotation.x = Math.PI / 2
  log.position.set(x, 0.4, 0)
  log.castShadow = true
  log.userData.kind = 'log'
  scene.add(log)
  things.push(log)
}
function spawnCarrot(x, y) {
  const carrot = new THREE.Group()
  const root = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.8, 12), carrotMat)
  root.rotation.z = Math.PI
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.4, 6), leafMat)
  leaves.position.y = 0.55
  carrot.add(root, leaves)
  carrot.position.set(x, y, 0)
  carrot.userData.kind = 'carrot'
  carrot.traverse((o) => { o.castShadow = true })
  scene.add(carrot)
  things.push(carrot)
}

let audio
function tone(freqs, type = 'sine', len = 0.15) {
  try {
    audio ??= new AudioContext()
    freqs.forEach((f, i) => {
      const osc = audio.createOscillator()
      const gain = audio.createGain()
      osc.type = type
      osc.frequency.value = f
      const t = audio.currentTime + i * 0.06
      gain.gain.setValueAtTime(0.18, t)
      gain.gain.exponentialRampToValueAtTime(0.001, t + len)
      osc.connect(gain).connect(audio.destination)
      osc.start(t)
      osc.stop(t + len)
    })
  } catch {}
}

let vy = 0
let y = 0
let jumps = 0
let score = 0
let speed = 7
let nextSpawn = 8
let stunned = 0
const hud = document.getElementById('hud')
const oops = document.getElementById('oops')
const hint = document.getElementById('hint')

function jump() {
  hint.style.display = 'none'
  if (jumps >= 2 || stunned > 0) return // a double jump is allowed
  vy = jumps === 0 ? 11 : 9
  jumps++
  tone([440, 660], 'triangle', 0.12)
}
addEventListener('pointerdown', jump)
addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump() } })

function resize() {
  renderer.setSize(innerWidth, innerHeight)
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
}
addEventListener('resize', resize)
resize()

const timer = new THREE.Timer()
renderer.setAnimationLoop(() => {
  timer.update()
  const dt = Math.min(timer.getDelta(), 0.05)
  const t = timer.getElapsed()
  speed = Math.min(14, speed + dt * 0.08)
  const move = (stunned > 0 ? speed * 0.3 : speed) * dt
  stunned = Math.max(0, stunned - dt)

  vy -= 30 * dt
  y = Math.max(0, y + vy * dt)
  if (y === 0) { vy = 0; jumps = 0 }
  bunny.position.y = y
  bunny.rotation.z = y > 0 ? THREE.MathUtils.clamp(vy * 0.03, -0.3, 0.3) : Math.sin(t * 18) * 0.05
  body.scale.y = y === 0 ? 0.9 + Math.abs(Math.sin(t * 9)) * 0.08 : 0.95

  nextSpawn -= move
  if (nextSpawn <= 0) {
    const x = 25
    const r = Math.random()
    if (r < 0.45) spawnLog(x)
    else if (r < 0.75) spawnCarrot(x, 0.8)
    else { spawnLog(x); spawnCarrot(x, 3.4) }
    nextSpawn = 6 + Math.random() * 6
  }

  for (let i = things.length - 1; i >= 0; i--) {
    const thing = things[i]
    thing.position.x -= move
    if (thing.userData.kind === 'carrot') thing.rotation.y += dt * 3
    const dx = Math.abs(thing.position.x - bunny.position.x)
    if (thing.userData.kind === 'carrot' && dx < 0.9 && Math.abs(thing.position.y - (y + 1)) < 1.3) {
      score++
      hud.textContent = `🥕 ${score}`
      tone([660, 880, 1100])
      scene.remove(thing)
      things.splice(i, 1)
      continue
    }
    if (thing.userData.kind === 'log' && !thing.userData.hit && dx < 0.8 && y < 0.7) {
      thing.userData.hit = true
      stunned = 0.8
      speed = Math.max(7, speed - 2)
      tone([300, 200], 'square', 0.2)
      oops.style.opacity = 1
      setTimeout(() => { oops.style.opacity = 0 }, 700)
    }
    if (thing.position.x < -15) { scene.remove(thing); things.splice(i, 1) }
  }
  for (const s of scenery) {
    s.position.x -= move
    if (s.position.x < -15) s.position.x += 50
  }
  renderer.render(scene, camera)
})
</script>
</body>
</html>
