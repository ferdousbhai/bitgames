<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Bunny Hop</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" class="hidden">
  <div class="hud-top">
    <div id="score" class="pill"><span class="icon">🥕</span><b id="score-num">0</b></div>
  </div>
  <div class="trip" aria-hidden="true">
    <div class="trip-track"><div id="trip-fill" class="trip-fill"></div></div>
    <div id="trip-stops" class="trip-stops"></div>
    <div id="trip-bunny" class="trip-bunny"><span>🐰</span></div>
  </div>
  <div id="banner" class="banner"></div>
  <div id="tap-hint" class="tap-hint" aria-hidden="true"><span class="tap-ring"></span><span class="tap-hand">👆</span></div>
</div>

<button id="mute" class="round hidden" aria-label="Sound">🔊</button>
<button id="home" class="round home hidden" aria-label="Home">🏠</button>

<div id="loading" class="screen">
  <div class="logo"><span>B</span><span>u</span><span>n</span><span>n</span><span>y</span> <span>H</span><span>o</span><span>p</span></div>
  <div class="hopper">🐰</div>
  <div class="bar"><div id="load-bar"></div></div>
</div>

<div id="menu" class="screen clear hidden">
  <div class="logo"><span>B</span><span>u</span><span>n</span><span>n</span><span>y</span> <span>H</span><span>o</span><span>p</span></div>
  <div class="spacer"></div>
  <div class="menu-bottom">
    <div id="menu-options" class="menu-options">
      <button id="pace" class="pace-choice" type="button" aria-pressed="false" aria-label="Slow hopping for little ones">
        <span class="pace-fast" aria-hidden="true">🐇</span><span class="pace-slow" aria-hidden="true">🐢</span>
      </button>
    </div>
    <button id="play" class="big-go" aria-label="Play">▶</button>
  </div>
</div>

<div id="results" class="screen clear hidden">
  <div class="spacer"></div>
  <div class="menu-bottom">
    <div id="haul" class="haul"><span class="haul-carrots">🥕 <b id="haul-num">0</b></span><span id="haul-gold" class="haul-gold"></span></div>
    <button id="again" class="big-go" aria-label="Hop again">🔁</button>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
