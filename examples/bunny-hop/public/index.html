<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Bunny Hop</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
<link rel="stylesheet" href="./adventure.css" />
</head>
<body>
<canvas id="view"></canvas>
<div id="popups"></div>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div id="score" class="pill"><span class="icon">🥕</span><b id="score-num">0</b></div>
  </div>
  <div class="trip" aria-hidden="true">
    <div class="trip-track"><div id="trip-fill" class="trip-fill"></div></div>
    <div class="trip-stops"><span>🌼</span><span>🍄</span><span>🍂</span><span>❄️</span><span>🏡</span></div>
    <div id="trip-bunny" class="trip-bunny"><span>🐰</span></div>
  </div>
  <div id="banner" class="banner"></div>
  <div id="tap-hint" class="tap-hint">👆 Tap to hop!</div>
</div>

<button id="mute" class="round hidden" title="Sound on/off (M)">🔊</button>

<div id="loading" class="screen">
  <div class="logo"><span>B</span><span>u</span><span>n</span><span>n</span><span>y</span> <span>H</span><span>o</span><span>p</span></div>
  <div class="hopper">🐰</div>
  <div class="bar"><div id="load-bar"></div></div>
</div>

<div id="menu" class="screen clear hidden">
  <div class="logo"><span>B</span><span>u</span><span>n</span><span>n</span><span>y</span> <span>H</span><span>o</span><span>p</span></div>
  <p class="sub">Help Pip hop all the way home! 🏡</p>
  <div class="spacer"></div>
  <div class="menu-bottom">
    <div id="best" class="best hidden"></div>
    <button id="play" class="big-go">▶ Let's hop!</button>
    <p class="hint">Tap to hop · tap again in the air to flip!</p>
  </div>
</div>

<div id="results" class="screen clear hidden">
  <div class="results-top">
    <h1>Home sweet home!</h1>
    <div id="stars" class="stars"></div>
  </div>
  <div class="spacer"></div>
  <div class="menu-bottom">
    <div class="tally"><span>🥕</span><b id="final">0</b><span id="new-best" class="new-best hidden">🏆 New best!</span></div>
    <div id="best-line" class="best"></div>
    <button id="again" class="big-go">🔁 Hop again</button>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
