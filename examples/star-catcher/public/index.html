<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b1446" />
<title>Star Catcher</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
<link rel="stylesheet" href="./adventure.css" />
</head>
<body>
<canvas id="view"></canvas>
<div id="safe" aria-hidden="true"></div>

<div id="hud" class="hidden">
  <div class="hud-top">
    <!-- The constellation being built: drawn by three.js (js/sky.js) inside this box -->
    <div id="sky-panel" aria-live="polite"><span id="sky-name" class="sky-name"></span></div>
    <div id="powers" class="powers"></div>
  </div>
  <div id="journey" class="journey"></div>
  <div class="hud-right">
    <button id="home" class="round" title="Home (Esc)" aria-label="Home">🏠</button>
    <button id="sound" class="round" title="Sound (M)" aria-label="Sound on or off">🔊</button>
  </div>
  <div id="banner" class="banner"></div>
  <div id="nudge"><span>👆</span></div>
  <div id="popups"></div>
</div>

<div id="start" class="screen">
  <div class="logo"><span>S</span><span>T</span><span>A</span><span>R</span> <span>C</span><span>A</span><span>T</span><span>C</span><span>H</span><span>E</span><span>R</span></div>
  <p class="tag">Fly with Kitty and light up the stars in the sky ✨</p>
  <button id="go" class="big-go" disabled>Loading…</button>
  <p class="hint small">Drag your finger or mouse, or use the arrow keys.</p>
</div>

<!-- Home at the end of the trip: the night sky of every constellation the child built -->
<div id="finale" class="screen hidden" aria-live="polite">
  <p class="finale-title">🏠 Home! Your night sky</p>
  <p id="finale-count" class="finale-count"></p>
  <div id="finale-sky" class="finale-sky"></div>
  <div class="finale-actions">
    <button id="again" class="big-go small-go">🚀 Fly again</button>
    <button id="finale-home" class="round" aria-label="Home">🏠</button>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
