<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b1446" />
<title>Star Catcher</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
</head>
<body>
<canvas id="view"></canvas>
<div id="safe" aria-hidden="true"></div>

<div id="hud" class="hidden">
  <div id="journey" class="journey"></div>
  <div class="hud-right">
    <button id="home" class="round" title="Home (hold)" aria-label="Home">🏠</button>
    <button id="sound" class="round" title="Sound (hold)" aria-label="Sound on or off">🔊</button>
  </div>
  <!-- Where the picture being caught waits faintly, and where it wakes up and plays (drawn by js/sky.js) -->
  <div id="stage" class="stage"></div>
  <div id="nudge"><span>👆</span></div>
  <div id="popups"></div>
</div>

<div id="start" class="screen">
  <button id="go" class="big-go" aria-label="Play" disabled>▶</button>
</div>

<!-- Home at the end of the trip: every star creature of the trip plays in the night sky -->
<div id="finale" class="screen hidden">
  <div id="zoo" class="zoo"></div>
  <div class="finale-actions">
    <button id="finale-home" class="round" aria-label="Home">🏠</button>
    <button id="again" class="big-go small-go" aria-label="Fly again">▶</button>
    <button id="finale-sound" class="round" aria-label="Sound on or off">🔊</button>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
