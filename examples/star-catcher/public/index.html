<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b1446" />
<title>Star Catcher</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<canvas id="view"></canvas>
<div id="safe" aria-hidden="true"></div>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div id="score" class="pill big">⭐ 0</div>
  </div>
  <div id="powers" class="powers"></div>
  <div id="journey" class="journey"></div>
  <div class="hud-right">
    <div id="best" class="pill">🏆 0</div>
    <button id="sound" class="round" title="Sound (M)" aria-label="Sound on or off">🔊</button>
  </div>
  <div id="banner" class="banner"></div>
  <div id="nudge"><span>👆</span></div>
  <div id="popups"></div>
</div>

<div id="start" class="screen">
  <div class="logo"><span>S</span><span>T</span><span>A</span><span>R</span> <span>C</span><span>A</span><span>T</span><span>C</span><span>H</span><span>E</span><span>R</span></div>
  <p class="tag">Fly with Kitty and catch the falling stars! ✨</p>
  <div class="legend">
    <span><b>⭐</b>1</span><span><b>💎</b>3</span><span><b>🌈</b>5</span><span><b>🧲</b>pull</span><span><b>💖</b>×2</span>
  </div>
  <button id="go" class="big-go" disabled>Loading…</button>
  <p id="best-start" class="hint"></p>
  <p class="hint small">Drag your finger or mouse, or use the arrow keys.</p>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
