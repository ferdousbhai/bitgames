<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Paint Splash</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
</head>
<body>
<canvas id="view"></canvas>

<div id="loading" class="screen">
  <div class="logo" aria-label="Paint Splash"><span>P</span><span>A</span><span>I</span><span>N</span><span>T</span> <span>S</span><span>P</span><span>L</span><span>A</span><span>S</span><span>H</span></div>
  <div class="spinner" aria-hidden="true">🎨</div>
  <div id="load-error" class="big-emoji hidden" aria-hidden="true">😕</div>
  <button id="retry" class="big-go hidden" aria-label="Try again">🔁</button>
</div>

<div id="menu" class="screen hidden">
  <div class="logo small" aria-label="Paint Splash"><span>P</span><span>A</span><span>I</span><span>N</span><span>T</span> <span>S</span><span>P</span><span>L</span><span>A</span><span>S</span><span>H</span></div>
  <div id="players" class="players"></div>
  <div class="picks">
    <div class="pick-row"><div id="animals" class="animal-row" role="group" aria-label="Pick your animal"></div></div>
    <div class="pick-row"><div id="places" class="places" role="group" aria-label="Pick a place"></div></div>
  </div>
  <div class="go-row">
    <button id="gallery-open" class="side-btn" aria-label="My pictures">🖼️</button>
    <button id="go" class="big-go play" aria-label="Paint!"><span class="tri" aria-hidden="true"></span></button>
    <button id="mode" class="side-btn mode-btn" aria-pressed="false" aria-label="Quick round with a sand timer">⏳</button>
  </div>
</div>

<div id="waiting" class="screen hidden">
  <div class="spinner" aria-hidden="true">🖌️</div>
  <div class="busy-sign" aria-hidden="true">🎨<span>⏳</span></div>
  <div id="players-waiting" class="players"></div>
  <div class="pick-row"><div id="animals-waiting" class="animal-row" role="group" aria-label="Pick your animal"></div></div>
</div>

<div id="hud" class="hidden">
  <div class="hud-left">
    <button id="home" class="round-btn" aria-label="Home">🏠</button>
    <button id="music" class="round-btn" aria-label="Music">🎵</button>
    <button id="sound" class="round-btn" aria-label="Sound">🔊</button>
  </div>
  <div class="hud-top">
    <div id="timer" class="pill timer hidden" aria-label="Sand timer"><span aria-hidden="true">⏳</span><i class="sand"><b id="sand"></b></i></div>
    <div id="mix-note" class="mix-note hidden" aria-live="polite"></div>
  </div>
  <button id="finish" class="finish-btn" aria-label="Finished"><canvas id="finish-thumb" width="100" height="69" aria-hidden="true"></canvas></button>
  <div id="finish-ask" class="finish-ask hidden" role="dialog" aria-label="Is your picture finished?">
    <button id="finish-yes" class="ask-btn yes" aria-label="Yes, finished">✅</button>
    <button id="finish-no" class="ask-btn no" aria-label="Keep painting">🖌️</button>
  </div>
  <div id="pots" class="pots" role="group" aria-label="Paint pots">
    <button class="pot" data-pot="1" aria-label="Red paint" style="--c:#eb5063"></button>
    <button class="pot" data-pot="2" aria-label="Yellow paint" style="--c:#f8d64e"></button>
    <button class="pot" data-pot="4" aria-label="Blue paint" style="--c:#4e8ad5"></button>
    <button class="pot rainbow" data-pot="16" aria-label="Rainbow paint"></button>
  </div>
  <button id="splat" class="splat-btn" aria-label="Splat!"><span class="blob" aria-hidden="true"></span></button>
  <div id="hint" class="drag-hint hidden" aria-hidden="true"><span class="finger">👆</span></div>
</div>

<div id="stick" class="stick hidden"><div id="knob" class="knob"></div></div>
<div id="countdown" class="countdown hidden"></div>
<div id="outline-pop" class="outline-pop hidden" aria-hidden="true"></div>

<div id="results" class="results hidden">
  <div class="results-top">
    <button id="results-save" class="round-btn keep-btn" aria-label="My pictures">🖼️</button>
  </div>
  <div class="panel">
    <div id="found" class="found"></div>
    <div id="cards" class="cards"></div>
    <div class="row">
      <button id="again" class="big-go play" aria-label="Paint again"><span class="tri" aria-hidden="true"></span></button>
      <button id="change" class="big-go alt" aria-label="New place">🗺️</button>
    </div>
    <div id="results-wait" class="big-emoji wait hidden" aria-hidden="true">⏳</div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
