<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Paint Splash</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
<link rel="stylesheet" href="./gallery.css" />
<link rel="stylesheet" href="./studio-dialog.css" />
<link rel="stylesheet" href="./colour-studio.css" />
</head>
<body>
<canvas id="view"></canvas>

<div id="loading" class="screen">
  <div class="logo"><span>P</span><span>A</span><span>I</span><span>N</span><span>T</span> <span>S</span><span>P</span><span>L</span><span>A</span><span>S</span><span>H</span></div>
  <div class="spinner">🎨</div>
  <div id="loading-text">Opening the paint pots…</div>
  <div id="load-error" class="hint hidden">😕 The paint got stuck. Try again?</div>
  <button id="retry" class="big-go hidden">🔁 Try again</button>
</div>

<div id="menu" class="screen hidden">
  <div class="logo small"><span>P</span><span>A</span><span>I</span><span>N</span><span>T</span> <span>S</span><span>P</span><span>L</span><span>A</span><span>S</span><span>H</span></div>
  <div id="players" class="players"></div>
  <div class="picks">
    <div class="pick-row"><span class="pick-label">🙋</span><div id="animals" class="animal-row"></div></div>
    <div class="pick-row"><span class="pick-label">🗺️</span><div id="places" class="places"></div></div>
  </div>
  <button id="go" class="big-go">🎨 Let's paint!</button>
  <div class="menu-extras">
    <button id="colour-open" class="extra-btn" aria-label="Mix my colours"><span class="ico">🔴🟡🔵</span><span class="lbl">Mix my colours</span></button>
    <button id="gallery-open" class="extra-btn" aria-label="My pictures"><span class="ico">🖼️</span><span class="lbl">My pictures</span></button>
  </div>
</div>

<div id="waiting" class="screen hidden">
  <div class="spinner">🖌️</div>
  <h2 id="waiting-text">Waiting for friends…</h2>
  <div id="players-waiting" class="players"></div>
  <div class="pick-row"><span class="pick-label">🙋</span><div id="animals-waiting" class="animal-row"></div></div>
  <p class="hint">⏳ The friend who started the game picks the place.</p>
</div>

<div id="hud" class="hidden">
  <div class="hud-left">
    <button id="home" class="round-btn" title="Home">🏠</button>
    <button id="music" class="round-btn" title="Music">🎵</button>
    <button id="sound" class="round-btn" title="Sound">🔊</button>
    <button id="gallery-save" class="round-btn" title="Keep a picture" aria-label="Keep a picture in your gallery">📷</button>
  </div>
  <div class="hud-top">
    <div id="timer" class="pill timer">⏱️ 75</div>
    <div id="bar" class="cover-bar"></div>
  </div>
  <button id="voice" class="voice-btn" title="Say hello! (Space)">📣</button>
  <div id="banner" class="banner"></div>
  <div id="hint" class="drag-hint hidden"><span class="finger">👆</span></div>
</div>

<div id="stick" class="stick hidden"><div id="knob" class="knob"></div></div>
<div id="countdown" class="countdown hidden"></div>
<div id="flash" class="flash" aria-hidden="true"></div>

<div id="results" class="results hidden">
  <div class="results-top">
    <h1 id="results-title">🎨 Look what we painted!</h1>
    <div id="together" class="together"></div>
    <button id="results-save" class="round-btn keep-btn" title="My pictures" aria-label="See this picture in My pictures">🖼️</button>
  </div>
  <div class="panel">
    <div id="cards" class="cards"></div>
    <div class="row">
      <button id="again" class="big-go">🔁 Paint again</button>
      <button id="change" class="big-go alt">🗺️ New place</button>
    </div>
    <p id="results-wait" class="hint hidden">⏳ Waiting for your friend to start the next picture…</p>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
