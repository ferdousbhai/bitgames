<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Balloon Pop</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>

<div id="loading" class="screen">
  <div class="logo"><span>B</span><span>A</span><span>L</span><span>L</span><span>O</span><span>O</span><span>N</span> <span>P</span><span>O</span><span>P</span></div>
  <div class="spinner">🎈</div>
  <div id="loading-text">Blowing up balloons…</div>
</div>

<div id="title" class="screen card-screen hidden">
  <div class="card">
    <div class="logo"><span>B</span><span>A</span><span>L</span><span>L</span><span>O</span><span>O</span><span>N</span> <span>P</span><span>O</span><span>P</span></div>
    <p class="tag">Tap the balloons before they float away!</p>
    <div class="friends"><span>🎈</span><span>💖</span><span>👑</span><span>🐰</span><span>⭐</span><span>🌈</span></div>
    <button id="play" class="big-go">▶ Play</button>
    <div class="scores"><span class="pill">🏆 Best <b id="best">0</b></span> <span id="last"></span></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-left">
    <button id="home" class="round-btn" title="Home (Esc)">🏠</button>
    <div class="pill score">🎈 <b id="score">0</b></div>
    <div id="best-badge" class="pill badge hidden">🏆 Best!</div>
  </div>
  <div class="hud-right">
    <button id="music" class="round-btn" title="Music">🎵</button>
    <button id="sound" class="round-btn" title="Sound">🔊</button>
  </div>
  <div class="level-wrap">
    <div id="level" class="level">Level 1</div>
    <div class="bar"><div id="bar-fill"></div></div>
  </div>
  <div id="banner" class="banner"></div>
  <div id="intro" class="intro"><div id="intro-emoji"></div><div id="intro-title"></div><div id="intro-sub"></div></div>
</div>

<div id="hint" class="hint-finger hidden">👆</div>
<div id="reticle" class="reticle hidden">📍</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
