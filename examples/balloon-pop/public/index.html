<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Balloon Pop</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
</head>
<body>
<canvas id="view"></canvas>

<div id="loading" class="screen">
  <div class="logo"><span>B</span><span>A</span><span>L</span><span>L</span><span>O</span><span>O</span><span>N</span> <span>P</span><span>O</span><span>P</span></div>
  <div class="spinner">🎈</div>
</div>

<div id="title" class="screen card-screen hidden">
  <div class="card">
    <div class="logo"><span>B</span><span>A</span><span>L</span><span>L</span><span>O</span><span>O</span><span>N</span> <span>P</span><span>O</span><span>P</span></div>
    <div class="friends" aria-hidden="true"><span>🎈</span><span>💖</span><span>👑</span><span class="giant-pic">🎈</span><span>🐰</span><span>⭐</span><span>🌈</span></div>
    <button id="play" class="big-go" aria-label="Play">▶</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-left">
    <button id="home" class="round-btn" aria-label="Home">🏠</button>
  </div>
  <div class="hud-right">
    <button id="music" class="round-btn" aria-label="Music">🎵</button>
    <button id="sound" class="round-btn" aria-label="Sound">🔊</button>
  </div>
  <div class="level-wrap"><div id="met" class="met" aria-label="Balloon friends"></div></div>
  <div id="intro" class="intro" aria-hidden="true"></div>
</div>

<div id="hint" class="hint-finger hidden" aria-hidden="true">👆</div>
<div id="reticle" class="reticle hidden" aria-hidden="true">📍</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
