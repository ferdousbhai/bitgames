<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Bumper Ducks</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>

<div id="loading" class="screen">
  <div class="logo"><span>B</span><span>U</span><span>M</span><span>P</span><span>E</span><span>R</span> <span>D</span><span>U</span><span>C</span><span>K</span><span>S</span></div>
  <div class="spinner">🦆</div>
  <div id="loading-text" aria-label="Loading"></div>
  <div id="load-error" class="hint hidden">😕</div>
  <button id="retry" class="big-go hidden" aria-label="Try again">🔁</button>
</div>

<div id="menu" class="screen hidden">
  <div class="logo small"><span>B</span><span>U</span><span>M</span><span>P</span><span>E</span><span>R</span> <span>D</span><span>U</span><span>C</span><span>K</span><span>S</span></div>
  <div id="players" class="players"></div>
  <div id="ducks" class="duck-row" aria-label="Pick your duck"></div>
  <div id="arenas" class="arenas" aria-label="Pick a place"></div>
  <button id="go" class="big-go" aria-label="Go">▶</button>
</div>

<div id="waiting" class="screen hidden">
  <div class="spinner">🦆💦</div>
  <h2 id="waiting-text">⏳</h2>
  <div id="players-waiting" class="players"></div>
  <div id="ducks-waiting" class="duck-row" aria-label="Pick your duck"></div>
</div>

<div id="corner" class="corner">
  <button id="home" class="round-btn hidden" aria-label="Home">🏠</button>
  <button id="music" class="round-btn" aria-label="Music">🎵</button>
  <button id="sound" class="round-btn" aria-label="Sound">🔊</button>
</div>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div id="timer" class="clock" aria-hidden="true"><span id="clock-emoji">🦆</span><svg viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="17" /><circle id="clock-ring" cx="20" cy="20" r="17" pathLength="100" /></svg></div>
    <div id="scores" class="scores"></div>
  </div>
  <div id="power" class="power hidden"><span id="power-emoji">⚡</span><svg viewBox="0 0 40 40"><circle id="power-ring" cx="20" cy="20" r="17" pathLength="100" /></svg></div>
  <div id="banner" class="banner"></div>
  <button id="dash" class="dash no-joy" aria-label="Dash"><span>💨</span><i id="dash-fill"></i></button>
  <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
  <div id="hint" class="hint-finger hidden"><span class="finger">👆</span></div>
  <div id="keys-hint" class="keys-hint hidden"><span>⬅️</span><span>⬆️</span><span>⬇️</span><span>➡️</span> <b>+</b> <span class="space">␣ 💨</span></div>
</div>

<div id="countdown" class="countdown hidden"></div>

<div id="results" class="screen hidden">
  <h1>🎉🐥🎉</h1>
  <div id="podium" class="podium"></div>
  <div class="row">
    <button id="again" class="big-go" aria-label="Again">🔁</button>
    <button id="change" class="big-go alt" aria-label="New place">🗺️</button>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
