<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Cake Stack</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
</head>
<body>
<canvas id="view"></canvas>

<div id="loading" class="screen">
  <div class="logo"><span>C</span><span>A</span><span>K</span><span>E</span> <span>S</span><span>T</span><span>A</span><span>C</span><span>K</span></div>
  <div class="spinner">🎂</div>
</div>

<div id="title" class="overlay hidden">
  <div class="title-top">
    <div class="logo"><span>C</span><span>A</span><span>K</span><span>E</span> <span>S</span><span>T</span><span>A</span><span>C</span><span>K</span></div>
  </div>
  <div class="title-bottom">
    <button id="play" class="big-go" aria-label="Play">▶</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-left">
    <button id="home" class="round-btn" aria-label="Home">🏠</button>
  </div>
  <div class="hud-right">
    <button id="music" class="round-btn" aria-label="Music">🎵</button>
    <button id="sound" class="round-btn" aria-label="Sound">🔊</button>
  </div>
  <div class="progress"><div id="pips" class="pips"></div></div>
  <div id="pantry" class="pantry hidden" role="group" aria-label="Flavours"></div>
  <div id="toppings" class="pantry toppings hidden" role="group" aria-label="Toppings"></div>
  <button id="done" class="done-btn hidden" aria-label="Candles">🕯️</button>
  <div id="intro" class="intro"><div id="intro-emoji"></div><div id="intro-title"></div><div id="intro-sub"></div></div>
</div>

<div id="card" class="overlay card-wrap hidden">
  <div class="card">
    <div id="card-emoji" class="card-emoji">🐻</div>
    <div id="shelf" class="shelf" aria-label="Your cakes"></div>
    <div class="row">
      <button id="next" class="big-go" aria-label="Next cake">▶<span id="next-peek" class="next-peek"></span></button>
      <button id="card-home" class="round-btn card-home" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<div id="hint" class="hint-finger hidden">👆</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
