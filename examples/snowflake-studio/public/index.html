<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edbedc">
<title>Snowflake Studio · BitGames</title>
<script type="importmap">{"imports":{"three":"https://bitgames.store/vendor/three/build/three.module.js","three/addons/":"https://bitgames.store/vendor/three/examples/jsm/"}}</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <button id="home" aria-label="Back to game menu">⌂</button>
  <div class="brand"><span>A LITTLE LEARNING ADVENTURE</span><h1>Snowflake Studio</h1></div>
  <button id="mute" aria-label="Mute sound" aria-pressed="false">♫</button>
</header>
<main>
  <section id="menu" class="panel">
    <span id="menu-emoji" class="hero-emoji"></span>
    <p id="tagline"></p>
    <p class="age" id="age"></p>
    <div class="levels" role="group" aria-label="Difficulty">
      <button data-level="0" aria-pressed="true">Little steps<span>Gentle start</span></button>
      <button data-level="1" aria-pressed="false">Growing<span>A little more</span></button>
      <button data-level="2" aria-pressed="false">Explorer<span>A bigger puzzle</span></button>
    </div>
    <button id="play" class="primary">Let’s play →</button>
    <p id="menu-instructions"></p>
    <p id="saved" class="saved"></p>
  </section>
  <section id="lesson" hidden>
    <div class="lesson-head"><span id="round"></span><span id="progress" aria-label="Adventure progress"></span></div>
    <div class="prompt-row"><h2 id="prompt"></h2><button id="listen" aria-label="Read the instruction aloud">🔈</button></div>
    <p id="hint"></p>
  </section>
  <div id="stage">
    <canvas id="view" aria-label="Three-dimensional toy world"></canvas>
    <div id="targets" aria-label="Game pieces"></div>
    <div id="loading" role="status">Making a little world…</div>
  </div>
  <section id="actions" aria-label="Game controls" hidden></section>
  <div id="feedback" role="status" aria-live="polite"></div>
  <section id="win" class="panel" hidden>
    <div class="hero-emoji">🌟</div>
    <h2>A wonderful adventure!</h2>
    <p id="win-text"></p>
    <button id="again" class="primary">Play another adventure&nbsp;→</button>
    <button id="win-home">Choose a difficulty</button>
  </section>
  <div id="error" class="panel" hidden>
    <h2>The toys need a moment</h2>
    <p id="error-text"></p>
    <button onclick="location.reload()">Try loading again</button>
  </div>
</main>
<footer id="footer"><span id="skill"></span><span>Explore at your own pace</span></footer>
<script type="module" src="./js/engine.js"></script>
</body>
</html>
