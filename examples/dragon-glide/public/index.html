<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#4aa8ff" />
<title>Dragon Glide</title>
<link rel="icon" href="data:," />
<script type="importmap">
{ "imports": {
  "three": "https://bitgames.store/vendor/three/build/three.module.js",
  "three/addons/": "https://bitgames.store/vendor/three/examples/jsm/"
} }
</script>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ipad.css" />
</head>
<body>
<canvas id="view"></canvas>
<div id="popups"></div>

<div id="hud" class="hidden">
  <div class="hud-left">
    <button id="home" class="round" aria-label="Home">🏠</button>
  </div>
  <div class="trip" aria-hidden="true">
    <div class="trip-track"><div id="trip-fill" class="trip-fill"></div></div>
    <div id="trip-stops" class="trip-stops"></div>
    <div id="trip-dragon" class="trip-dragon"><span>🐉</span></div>
  </div>
  <div id="banner" class="banner" aria-hidden="true"></div>
  <div id="bag" class="bag empty" aria-hidden="true"></div>
  <div id="hand" class="hand" aria-hidden="true"><span>👆</span></div>
  <button id="fire" class="fire" aria-label="Puff fire">🔥</button>
  <button id="fly-on" class="big-go fly-on hidden">▶</button>
</div>

<div id="corner" class="corner hidden">
  <button id="music" class="round" aria-label="Music on or off">🎵</button>
  <button id="sound" class="round" aria-label="Sound on or off">🔊</button>
</div>

<div id="loading" class="screen">
  <div class="logo"><span>D</span><span>r</span><span>a</span><span>g</span><span>o</span><span>n</span> <span>G</span><span>l</span><span>i</span><span>d</span><span>e</span></div>
  <div class="flyer">🐉</div>
  <div class="bar"><div id="load-bar"></div></div>
</div>

<div id="title" class="screen clear hidden">
  <div class="logo"><span>D</span><span>r</span><span>a</span><span>g</span><span>o</span><span>n</span> <span>G</span><span>l</span><span>i</span><span>d</span><span>e</span></div>
  <div class="spacer"></div>
  <div class="menu-bottom">
    <div id="worlds" class="worlds"></div>
    <button id="play" class="big-go play" aria-label="Play">▶</button>
  </div>
</div>

<div id="results" class="screen clear hidden">
  <div id="found" class="learned" aria-label="The treasures Ember found"></div>
  <div class="spacer"></div>
  <div class="menu-bottom">
    <div class="row">
      <button id="again" class="big-go" aria-label="Fly again">🔁</button>
      <button id="to-title" class="big-go alt" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
