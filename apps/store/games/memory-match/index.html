<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Memory Match</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d8f6f2; font-family: system-ui, sans-serif; touch-action: none; user-select: none; }
  #win { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-size: 56px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #2ec4b6, 0 8px 16px rgba(0,0,0,.2); }
  #win button { font: inherit; font-size: 32px; padding: 14px 36px; border: 0; border-radius: 999px; background: #ffbe0b; color: #2b2d42; box-shadow: 0 6px 0 #c48f00; cursor: pointer; text-shadow: none; }
  #win button:active { transform: translateY(4px); box-shadow: 0 2px 0 #c48f00; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }</script>
</head>
<body>
<div id="win"><div>You did it! 🎉</div><button id="again">Play again</button></div>
<script type="module">
import * as THREE from 'three'

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color('#d8f6f2')
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100)
scene.add(new THREE.HemisphereLight('#ffffff', '#b3ecff', 2.5))
const light = new THREE.DirectionalLight('#ffffff', 1.2)
light.position.set(2, 3, 8)
scene.add(light)

const ANIMALS = ['🐶', '🐱', '🐸', '🦁', '🐼', '🐵', '🐷', '🦊']
const COLS = 4
const ROWS = 3
const CARD_W = 2
const CARD_H = 2.6
const GAP = 0.4

function faceTexture(emoji) {
  const c = document.createElement('canvas')
  c.width = 256; c.height = 332
  const g = c.getContext('2d')
  g.fillStyle = '#ffffff'
  g.beginPath(); g.roundRect(0, 0, 256, 332, 36); g.fill()
  g.font = '170px system-ui, "Apple Color Emoji", "Noto Color Emoji", sans-serif'
  g.textAlign = 'center'; g.textBaseline = 'middle'
  g.fillText(emoji, 128, 176)
  const tex = new THREE.CanvasTexture(c)
  tex.colorSpace = THREE.SRGBColorSpace
  return tex
}
function backTexture() {
  const c = document.createElement('canvas')
  c.width = 256; c.height = 332
  const g = c.getContext('2d')
  g.fillStyle = '#6c63ff'
  g.beginPath(); g.roundRect(0, 0, 256, 332, 36); g.fill()
  g.fillStyle = 'rgba(255,255,255,0.25)'
  for (let y = 20; y < 332; y += 48) for (let x = (y / 48) % 2 ? 44 : 20; x < 256; x += 48) {
    g.beginPath(); g.arc(x, y, 9, 0, Math.PI * 2); g.fill()
  }
  g.font = 'bold 120px system-ui, sans-serif'
  g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.textBaseline = 'middle'
  g.fillText('?', 128, 170)
  const tex = new THREE.CanvasTexture(c)
  tex.colorSpace = THREE.SRGBColorSpace
  return tex
}
const BACK = new THREE.MeshStandardMaterial({ map: backTexture() })
const EDGE = new THREE.MeshStandardMaterial({ color: '#ffffff' })
const faces = Object.fromEntries(ANIMALS.map((a) => [a, new THREE.MeshStandardMaterial({ map: faceTexture(a) })]))
const geometry = new THREE.BoxGeometry(CARD_W, CARD_H, 0.12)

let cards = []
let open = []
let matched = 0
let busy = false
const confetti = []
const win = document.getElementById('win')

function deal() {
  for (const card of cards) scene.remove(card)
  cards = []; open = []; matched = 0; busy = false
  win.style.display = 'none'
  const pairs = ANIMALS.slice().sort(() => Math.random() - 0.5).slice(0, (COLS * ROWS) / 2)
  const deck = [...pairs, ...pairs].sort(() => Math.random() - 0.5)
  deck.forEach((animal, i) => {
    // Box faces: +x, -x, +y, -y, +z (back, facing us), -z (animal, shown after flipping)
    const card = new THREE.Mesh(geometry, [EDGE, EDGE, EDGE, EDGE, BACK, faces[animal]])
    const col = i % COLS
    const row = Math.floor(i / COLS)
    card.position.set((col - (COLS - 1) / 2) * (CARD_W + GAP), ((ROWS - 1) / 2 - row) * (CARD_H + GAP), 0)
    card.userData = { animal, flipped: false, done: false, target: 0, bounce: 0 }
    card.scale.setScalar(0.01)
    card.userData.appear = i * 0.05
    scene.add(card)
    cards.push(card)
  })
}

let audio
function tone(freqs, type = 'sine') {
  try {
    audio ??= new AudioContext()
    freqs.forEach((f, i) => {
      const osc = audio.createOscillator()
      const gain = audio.createGain()
      osc.type = type
      osc.frequency.value = f
      const t = audio.currentTime + i * 0.08
      gain.gain.setValueAtTime(0.18, t)
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2)
      osc.connect(gain).connect(audio.destination)
      osc.start(t); osc.stop(t + 0.2)
    })
  } catch {}
}

function flip(card, up) {
  card.userData.flipped = up
  card.userData.target = up ? Math.PI : 0
}

const raycaster = new THREE.Raycaster()
const pointer = new THREE.Vector2()
addEventListener('pointerdown', (e) => {
  if (busy) return
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1)
  raycaster.setFromCamera(pointer, camera)
  const hit = raycaster.intersectObjects(cards)[0]
  if (!hit) return
  const card = hit.object
  if (card.userData.flipped || card.userData.done) return
  flip(card, true)
  tone([520], 'triangle')
  open.push(card)
  if (open.length < 2) return
  const [a, b] = open
  open = []
  if (a.userData.animal === b.userData.animal) {
    a.userData.done = b.userData.done = true
    a.userData.bounce = b.userData.bounce = 1
    matched += 2
    setTimeout(() => tone([660, 880, 1320]), 250)
    if (matched === cards.length) setTimeout(celebrate, 700)
  } else {
    busy = true
    setTimeout(() => { flip(a, false); flip(b, false); busy = false }, 900)
  }
})

function celebrate() {
  tone([523, 659, 784, 1047, 1319])
  win.style.display = 'flex'
  const colors = ['#ff6b9d', '#ffbe0b', '#8ac926', '#2ec4b6', '#6c63ff']
  for (let i = 0; i < 120; i++) {
    const piece = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.4), new THREE.MeshBasicMaterial({ color: colors[i % colors.length], side: THREE.DoubleSide }))
    piece.position.set((Math.random() - 0.5) * 16, 6 + Math.random() * 6, 1 + Math.random() * 2)
    piece.userData = { vy: -2 - Math.random() * 3, spin: new THREE.Vector3(Math.random() * 6, Math.random() * 6, 0) }
    scene.add(piece)
    confetti.push(piece)
  }
}
document.getElementById('again').addEventListener('pointerdown', (e) => {
  e.stopPropagation()
  for (const p of confetti) scene.remove(p)
  confetti.length = 0
  deal()
})

function resize() {
  renderer.setSize(innerWidth, innerHeight)
  camera.aspect = innerWidth / innerHeight
  // Fit the whole board on screen in portrait or landscape
  const boardW = COLS * (CARD_W + GAP) + 1
  const boardH = ROWS * (CARD_H + GAP) + 1
  const vFov = (camera.fov * Math.PI) / 180
  const distH = boardH / 2 / Math.tan(vFov / 2)
  const distW = boardW / 2 / Math.tan(vFov / 2) / camera.aspect
  camera.position.set(0, 0, Math.max(distH, distW))
  camera.updateProjectionMatrix()
}
addEventListener('resize', resize)
resize()
deal()

const clock = new THREE.Clock()
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05)
  for (const card of cards) {
    const u = card.userData
    if (u.appear > 0) u.appear -= dt
    else card.scale.setScalar(Math.min(1, card.scale.x + dt * 4) + Math.sin(u.bounce * Math.PI) * 0.12)
    u.bounce = Math.max(0, u.bounce - dt * 2)
    card.rotation.y += (u.target - card.rotation.y) * Math.min(1, dt * 12)
  }
  for (const p of confetti) {
    p.position.y += p.userData.vy * dt
    p.rotation.x += p.userData.spin.x * dt
    p.rotation.y += p.userData.spin.y * dt
    if (p.position.y < -8) p.position.y = 8
  }
  renderer.render(scene, camera)
})
</script>
</body>
</html>
